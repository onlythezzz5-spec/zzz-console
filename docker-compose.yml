services:
  zzz-console:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: zzz-console
    # hostname: yourhostname <<--- optional
    volumes:
      - $PWD/db/:/etc/zzz/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      ZZZ_ENABLE_FAIL2BAN: "true"
    tty: true
    network_mode: host
    restart: unless-stopped
